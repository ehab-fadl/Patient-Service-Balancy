name: Deploy Patient Service to Home Server

on:
  push:
    branches: [ main ] # أو اسم الفرع الذي تعتمد عليه مثل master

jobs:
  deploy:
    runs-on: self-hosted # ليتصل بالـ Runner المثبت على السيرفر المنزلي لديك

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          docker compose down
          docker compose up --build -d